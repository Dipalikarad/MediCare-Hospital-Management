# ============================================================
#  Hospital Management System – Spring Boot Application Config
#  PHASE 1: application.properties
#  File: src/main/resources/application.properties
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Application name ─────────────────────────────────────────
spring.application.name=hospital-backend

# ── MySQL DataSource ─────────────────────────────────────────
# Change these values or override via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Deep@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT Configuration ────────────────────────────────────────
# Generate a strong Base64-encoded 512-bit secret:
#   openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:dvdlt795ig4mdgf1ssmgjchaqagtjh3h}
app.jwt.expiration-ms=86400000
# 24 hours = 86400000 ms

# ── Google OAuth2 ─────────────────────────────────────────────

# ── Frontend / CORS Origin ───────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Google Client ID (used in backend token verification) ────
app.google.client-id=${GOOGLE_CLIENT_ID:770357671187-dvdlt795ig4mdgf1ssmgjchaqagtjh3h.apps.googleusercontent.com}

# ── Password Reset Token Expiry (minutes) ────────────────────
app.password-reset.expiry-minutes=30

# ── Email (Spring Mail) ──────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dipalikarad25@gmail.com}
spring.mail.password=${MAIL_PASSWORD:Dipali25&}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Pagination defaults ──────────────────────────────────────
app.pagination.default-page-size=10
app.pagination.max-page-size=100

# ── Actuator (health check only in prod) ─────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Logging ──────────────────────────────────────────────────
logging.level.com.hospital=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
